Title: 为什么纯文件博客依然很好用
Date: 2026-05-11 22:00
Slug: wei-shi-me-chun-wen-jian-bo-ke-yi-ran-hao-yong
Summary: 对小网站来说，纯文件系统依然简单、稳定，而且很好维护。
----
<p>对个人网站来说，很多时候纯文件就已经够用了。</p>
<p>每篇文章都是一个独立 HTML 文件，这意味着备份很方便、主机成本低，而且时间久了也不容易出奇怪问题。</p>
<blockquote>很多时候，最好的 CMS，就是五年后你自己还能看懂的那个。</blockquote>
<p>这也是这个项目背后的核心思路。</p>
